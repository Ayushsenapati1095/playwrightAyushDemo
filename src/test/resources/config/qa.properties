# Sauce demo store (QA). Override any key with -Dkey=value or an environment variable (KEY_NAME).
base.url=https://sauce-demo.myshopify.com
api.base.url=https://sauce-demo.myshopify.com

# chromium | chrome | msedge | firefox | webkit
browser=chromium
headless=true
slow.mo=0
viewport.width=1440
viewport.height=900

# Timeouts (ms)
timeout.ms=15000
navigation.timeout.ms=30000

# Diagnostics
trace.on.failure=true
video.on.failure=false

# Retries (keep 0 locally; CI passes -Dretry.count=1)
retry.count=0
